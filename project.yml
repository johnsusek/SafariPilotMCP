name: SafariPilot
options:
  bundleIdPrefix: net.johnsolo
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.12.1
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
settings:
  base:
    DEVELOPMENT_TEAM: WX2UGCD2SK
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "130"
targets:
  SafariPilot:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - CLI/Tools.swift
      - CLI/TabSession.swift
    dependencies:
      - target: SafariPilotExtension
        embed: true
      - target: SafariPilotCLI
        embed: true
        copy:
          destination: sharedSupport
      - package: Sparkle
        product: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SafariPilot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSUIElement: true
        NSHumanReadableCopyright: © 2026 John Susek
        NSSupportsSuddenTermination: false
        SUFeedURL: https://github.com/johnsusek/SafariPilotMCP/releases/latest/download/appcast.xml
        SUPublicEDKey: af0mLsWu4Mkhz7apmzdIVpUOb173cCsfwVp0mWSHUOE=
        SUEnableAutomaticChecks: true
    entitlements:
      path: App/SafariPilot.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.application-groups:
          - WX2UGCD2SK.net.johnsolo.SafariPilot
        keychain-access-groups:
          - $(AppIdentifierPrefix)net.johnsolo.SafariPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.johnsolo.SafariPilot
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SafariPilotExtension:
    type: app-extension
    platform: macOS
    sources:
      - Appex
      - Shared/Wire.swift
      - Shared/ErrorCode.swift
      - Shared/JSONValue.swift
      - path: extension
        buildPhase: resources
    preBuildScripts:
      - name: Build web extension
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$SRCROOT/web" && npm run build
    info:
      path: Appex/Info.plist
      properties:
        CFBundleDisplayName: SafariPilot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Appex/SafariPilotExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - WX2UGCD2SK.net.johnsolo.SafariPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.johnsolo.SafariPilot.Extension
        ENABLE_HARDENED_RUNTIME: YES
  SafariPilotCLI:
    type: tool
    platform: macOS
    sources:
      - CLI
      - Shared/Wire.swift
      - Shared/ErrorCode.swift
      - Shared/JSONValue.swift
      - Shared/CLIWire.swift
      - Shared/KeyChord.swift
      - Shared/Contract.swift
      - Shared/PageRef.swift
      - Shared/Redaction.swift
      - Shared/PageFetch.swift
      - Shared/ViewportMapping.swift
    dependencies:
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_NAME: safaripilot
        PRODUCT_MODULE_NAME: SafariPilotCLI
        PRODUCT_BUNDLE_IDENTIFIER: net.johnsolo.SafariPilot.cli
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  SafariPilotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
      - CLI/Tools.swift
      - CLI/TabSession.swift
      - CLI/CommandLineParsing.swift
      - CLI/Wait.swift
      - CLI/ToolResult.swift
      - App/ClaudeSetup.swift
      - App/ClientCredentials.swift
      - App/ApprovalQueue.swift
      - App/CommandQueue.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.johnsolo.SafariPilot.Tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SafariPilot:
    build:
      targets:
        SafariPilot: all
        SafariPilotTests: [test]
    test:
      targets:
        - SafariPilotTests
